<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Payment System</title>
</head>

<body>

    <!-- buying section start here -->
    <section>
        <div class="container">
            <div class="box">
                <div class="row  align-items-center">
                    <div class="col-md-12">

                        <div class="shoes img-left">
                            <img src="images/shoes.jpg" class="img-fluid  d-block py-5">
                        </div>
                        <h2 class="text-center fs-3 fw-semibold pb-2">Air Shoes</h2>
                        <!-- <i class="fa-solid fa-indian-rupee-sign"></i> -->
                        <p class="text-center fs-4">1999</p>

                        <button id="addBtn" class="mx-auto d-block padd">Add to Cart</button><br>
                        <button id="buyBtn" class="hidden m-left padd">Buy Now</button><br>
                        <button id="payBtn" class="hidden m-left padd">Pay Now</button>
                        <p id="message" class="text-center mt-2"></p>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- buying section end here -->

    <!-- scipt -->
    <script src="js/script.js"></script>
</body>

</html>
